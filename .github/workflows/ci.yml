name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AOAHID_REPOSITORY: nemarpuc/libaoahid
  # Changing the tag means changing the hashes in the matrix below too.
  AOAHID_TAG: v0.2.0
  MIMUSB_REPOSITORY: nemarpuc/libmimusb
  # Changing the tag means changing the hashes in the matrix below too.
  MIMUSB_TAG: v0.7.2

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built on Ubuntu 22.04 (glibc 2.35, like libaoahid and libmimusb), so the
          # programs run on it and on anything newer, not only on the runner's own release.
          - os: ubuntu-22.04
            platform: linux
            aoahid_asset: libaoahid-*-linux-x86_64-ubuntu22.04.tar.gz
            aoahid_sha256: def7b55f6c54a372a2eca23166ec91d89458048300cd466358ab5d5341357289
            mimusb_asset: libmimusb-*-linux-x86_64-ubuntu22.04.tar.gz
            mimusb_sha256: 8ccad9db0422a0c7d88a2cf4a3d68af438d1918a886e08127971dc2766b0db29
          - os: windows-2022
            platform: windows
            aoahid_asset: libaoahid-*-windows-x86_64.zip
            aoahid_sha256: 48fe342efa2083e3ee4560ef9471bbc8330241df3395dce58b883f69174bc610
            mimusb_asset: libmimusb-*-windows-x86_64.zip
            mimusb_sha256: 9bba4653ca977316ba1d265dd7bb7169b3693a850e4faa6affff79b482c4c734
          - os: macos-15
            platform: macos
            aoahid_asset: libaoahid-*-macos-arm64.tar.gz
            aoahid_sha256: 643b0be661a3d4f60eaf7cfd23bfe169df381bd0bc269f081b47d1146caccb02
            mimusb_asset: libmimusb-*-macos-arm64.tar.gz
            mimusb_sha256: bc3774c0251ae89bce554c743b3adc2a2b043a03abaea757e1873228ad40b737
          - os: macos-15-intel
            platform: macos
            aoahid_asset: libaoahid-*-macos-x86_64.tar.gz
            aoahid_sha256: 37a9d61f167533b9f07a1d487abce547171c2f95421cc41de4702f846910b387
            mimusb_asset: libmimusb-*-macos-x86_64.tar.gz
            mimusb_sha256: 56cee44fa036fe876086536f87a8efd2799dc1e3aede1fe7d142610bdc6df3db
          - os: ubuntu-22.04-arm
            platform: linux
            aoahid_asset: libaoahid-*-linux-aarch64-ubuntu22.04.tar.gz
            aoahid_sha256: 1d3afe1a4c436c65802aa506d8388cd3fe65a6bdef5b6f07610607550cb4612d
            mimusb_asset: libmimusb-*-linux-aarch64-ubuntu22.04.tar.gz
            mimusb_sha256: cafd574bf2085af37e75cac228034248aa13af0b25f4db200ab45a3abaf3ec5d
          - os: windows-11-arm
            platform: windows
            cmake_arch: ARM64
            aoahid_asset: libaoahid-*-windows-arm64.zip
            aoahid_sha256: f03a1682e5a03c3b6d6de4b9b5452e762fe120062a65760b2983388f4117abce
            mimusb_asset: libmimusb-*-windows-arm64.zip
            mimusb_sha256: 3b2c6151b3d46a994d71ee025c6903b092441ed226175096b5b682b0cbc5f9d2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build pkg-config \
            meson python3-attr python3-jinja2 curl bzip2 \
            libwayland-dev libwayland-bin libdbus-1-dev \
            libxcb1-dev libxcb-xfixes0-dev libxcb-xinput-dev libxcb-randr0-dev \
            libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev libgl1-mesa-dev xvfb libgl1-mesa-dri libegl1

      - name: Build libei
        if: matrix.platform == 'linux'
        run: .github/scripts/build-libei.sh

      - name: Download libaoahid release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dependencies
          gh release download "$AOAHID_TAG" --repo "$AOAHID_REPOSITORY" \
            --pattern '${{ matrix.aoahid_asset }}' --dir dependencies
          cd dependencies
          shopt -s nullglob
          archives=(${{ matrix.aoahid_asset }})
          shopt -u nullglob
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one matching asset, found ${#archives[@]}."
            exit 1
          fi
          # Checked against the hash pinned in this file, not one fetched
          # from the same place as the archive.
          if command -v sha256sum > /dev/null; then
            echo "${{ matrix.aoahid_sha256 }}  ${archives[0]}" | sha256sum -c -
          else
            echo "${{ matrix.aoahid_sha256 }}  ${archives[0]}" | shasum -a 256 -c -
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            unzip -q "${archives[0]}"
          else
            tar -xzf "${archives[0]}"
          fi
          base="${archives[0]%.tar.gz}"
          base="${base%.zip}"
          if [ ! -f "$base/lib/cmake/aoahid/aoahid-config.cmake" ]; then
            echo "::error::$base does not look like a libaoahid CMake package."
            exit 1
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            prefix="$(cygpath -m "$PWD/$base")"
          else
            prefix="$PWD/$base"
          fi
          echo "AOAHID_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Download libmimusb release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dependencies-mimusb
          gh release download "$MIMUSB_TAG" --repo "$MIMUSB_REPOSITORY" \
            --pattern '${{ matrix.mimusb_asset }}' --dir dependencies-mimusb
          cd dependencies-mimusb
          shopt -s nullglob
          archives=(${{ matrix.mimusb_asset }})
          shopt -u nullglob
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one matching asset, found ${#archives[@]}."
            exit 1
          fi
          if command -v sha256sum > /dev/null; then
            echo "${{ matrix.mimusb_sha256 }}  ${archives[0]}" | sha256sum -c -
          else
            echo "${{ matrix.mimusb_sha256 }}  ${archives[0]}" | shasum -a 256 -c -
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            unzip -q "${archives[0]}"
          else
            tar -xzf "${archives[0]}"
          fi
          base="${archives[0]%.tar.gz}"
          base="${base%.zip}"
          if [ ! -f "$base/lib/cmake/mimusb/mimusb-config.cmake" ]; then
            echo "::error::$base does not look like a libmimusb CMake package."
            exit 1
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            prefix="$(cygpath -m "$PWD/$base")"
          else
            prefix="$PWD/$base"
          fi
          echo "MIMUSB_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          werror=OFF
          if [ "${{ matrix.platform }}" = "linux" ]; then werror=ON; fi
          # The Visual Studio generator is told the architecture; the others need nothing.
          if [ -n "${{ matrix.cmake_arch }}" ]; then
            cmake -S . -B build -A "${{ matrix.cmake_arch }}" -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$AOAHID_PREFIX;$MIMUSB_PREFIX" -DHID_SHARE_WERROR=$werror
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$AOAHID_PREFIX;$MIMUSB_PREFIX" -DHID_SHARE_WERROR=$werror
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Smoke test the binaries
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "windows" ]; then
            out=build/out/Release
            exe=".exe"
            # The libaoahid and libmimusb DLLs have to be next to the programs.
            cp "$AOAHID_PREFIX"/bin/*.dll "$MIMUSB_PREFIX"/bin/*.dll "$out"/
          else
            out=build/out
            exe=""
            export LD_LIBRARY_PATH="$AOAHID_PREFIX/lib:$MIMUSB_PREFIX/lib:${LD_LIBRARY_PATH:-}"
            export DYLD_LIBRARY_PATH="$AOAHID_PREFIX/lib:$MIMUSB_PREFIX/lib"
          fi
          "$out/hid_share$exe" --version
          test -f "$out/hid_share_daemon$exe"
          # With no daemon running, a command has to fail with a message.
          if "$out/hid_share$exe" status 2> out.txt; then
            echo "::error::status succeeded without a daemon"; exit 1
          fi
          grep -q "not running" out.txt
