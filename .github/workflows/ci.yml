name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AOAHID_REPOSITORY: nemarpuc/libaoahid
  # Changing the tag means changing the hashes in the matrix below too.
  AOAHID_TAG: v1.0.1
  MIMHID_REPOSITORY: nemarpuc/libmimhid
  # Changing the tag means changing the hashes in the matrix below too.
  MIMHID_TAG: v1.0.2

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            aoahid_asset: libaoahid-*-linux-x86_64-ubuntu22.04-shared.tar.gz
            aoahid_sha256: b418b987f8bcff373381432db38807e079052f3a5924717e7b57667f9fe7709b
            mimhid_asset: libmimhid-*-linux-x86_64-ubuntu22.04-shared.tar.gz
            mimhid_sha256: dd50f081a37e43968820cfcfc9b0b2bc60a51170651a95856db77bcde4e2c839
          - os: windows-2022
            platform: windows
            aoahid_asset: libaoahid-*-windows-x86_64-shared.zip
            aoahid_sha256: fd50e681064d54dd40def89f0d47990204d865cc41193c11c4a9323f140f9c50
            mimhid_asset: libmimhid-*-windows-x86_64-shared.zip
            mimhid_sha256: be1a95f3cddb3a227b20d126a5ee4394948ba37056b3331a860102f6dd8793ec
          - os: macos-15
            platform: macos
            aoahid_asset: libaoahid-*-macos-arm64-shared.tar.gz
            aoahid_sha256: 350040e9e9562e1783fed73e42e4fc7886b48dca6cef5a5b4ffbaf97cfebc9ed
            mimhid_asset: libmimhid-*-macos-arm64-shared.tar.gz
            mimhid_sha256: befea223d32f8bfe687de82de6f63142c06f02bced3ff6de5447aee1dc70ac37
          - os: macos-15-intel
            platform: macos
            aoahid_asset: libaoahid-*-macos-x86_64-shared.tar.gz
            aoahid_sha256: c9a21027af6c95e3e9ab73a4cc58d268522acc90f4c742ac38af8a201b7fc9de
            mimhid_asset: libmimhid-*-macos-x86_64-shared.tar.gz
            mimhid_sha256: e9f8e7f328a3eb70ff59b53f3d441693a455b2e68d471f402328ba0b93075c95
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build pkg-config \
            libwayland-dev libwayland-bin libdbus-1-dev libei-dev \
            libxcb1-dev libxcb-xfixes0-dev libxcb-xinput-dev libxcb-randr0-dev \
            libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev libgl1-mesa-dev xvfb libgl1-mesa-dri libegl1

      - name: Download libaoahid release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dependencies
          gh release download "$AOAHID_TAG" --repo "$AOAHID_REPOSITORY" \
            --pattern '${{ matrix.aoahid_asset }}' --dir dependencies
          cd dependencies
          shopt -s nullglob
          archives=(${{ matrix.aoahid_asset }})
          shopt -u nullglob
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one matching asset, found ${#archives[@]}."
            exit 1
          fi
          # Checked against the hash pinned in this file, not one fetched
          # from the same place as the archive.
          if command -v sha256sum > /dev/null; then
            echo "${{ matrix.aoahid_sha256 }}  ${archives[0]}" | sha256sum -c -
          else
            echo "${{ matrix.aoahid_sha256 }}  ${archives[0]}" | shasum -a 256 -c -
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            unzip -q "${archives[0]}"
          else
            tar -xzf "${archives[0]}"
          fi
          base="${archives[0]%.tar.gz}"
          base="${base%.zip}"
          if [ ! -f "$base/lib/cmake/aoahid/aoahid-config.cmake" ]; then
            echo "::error::$base does not look like a libaoahid CMake package."
            exit 1
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            prefix="$(cygpath -m "$PWD/$base")"
          else
            prefix="$PWD/$base"
          fi
          echo "AOAHID_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Download libmimhid release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dependencies-mimhid
          gh release download "$MIMHID_TAG" --repo "$MIMHID_REPOSITORY" \
            --pattern '${{ matrix.mimhid_asset }}' --dir dependencies-mimhid
          cd dependencies-mimhid
          shopt -s nullglob
          archives=(${{ matrix.mimhid_asset }})
          shopt -u nullglob
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one matching asset, found ${#archives[@]}."
            exit 1
          fi
          if command -v sha256sum > /dev/null; then
            echo "${{ matrix.mimhid_sha256 }}  ${archives[0]}" | sha256sum -c -
          else
            echo "${{ matrix.mimhid_sha256 }}  ${archives[0]}" | shasum -a 256 -c -
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            unzip -q "${archives[0]}"
          else
            tar -xzf "${archives[0]}"
          fi
          base="${archives[0]%.tar.gz}"
          base="${base%.zip}"
          if [ ! -f "$base/lib/cmake/mimhid/mimhid-config.cmake" ]; then
            echo "::error::$base does not look like a libmimhid CMake package."
            exit 1
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            prefix="$(cygpath -m "$PWD/$base")"
          else
            prefix="$PWD/$base"
          fi
          echo "MIMHID_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          werror=OFF
          if [ "${{ matrix.platform }}" = "linux" ]; then werror=ON; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$AOAHID_PREFIX;$MIMHID_PREFIX" -DHID_SHARE_WERROR=$werror

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Smoke test the binaries
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "windows" ]; then
            out=build/out/Release
            exe=".exe"
            # The libaoahid and libmimhid DLLs have to be next to the programs.
            cp "$AOAHID_PREFIX"/bin/*.dll "$MIMHID_PREFIX"/bin/*.dll "$out"/
          else
            out=build/out
            exe=""
            export LD_LIBRARY_PATH="$AOAHID_PREFIX/lib:$MIMHID_PREFIX/lib"
            export DYLD_LIBRARY_PATH="$AOAHID_PREFIX/lib:$MIMHID_PREFIX/lib"
          fi
          "$out/hid_share$exe" --version
          test -f "$out/hid_share_daemon$exe"
          # With no daemon running, a command has to fail with a message.
          if "$out/hid_share$exe" status 2> out.txt; then
            echo "::error::status succeeded without a daemon"; exit 1
          fi
          grep -q "not running" out.txt
