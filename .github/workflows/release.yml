name: release

# Builds the archives for a version tag and publishes them as a GitHub
# release. Tag only a commit whose ci run passed.
on:
  push:
    tags:
      - "v*"
  # Run by hand, it builds and uploads the archives but publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

env:
  AOAHID_REPOSITORY: nemarpuc/libaoahid
  # Changing the tag means changing the hashes in the matrix below too.
  AOAHID_TAG: v2.0.0
  MIMHID_REPOSITORY: nemarpuc/libmimhid
  # Changing the tag means changing the hashes in the matrix below too.
  MIMHID_TAG: v1.3.6

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            name: linux-x86_64
            aoahid_asset: libaoahid-*-linux-x86_64-ubuntu22.04-shared.tar.gz
            aoahid_sha256: b418b987f8bcff373381432db38807e079052f3a5924717e7b57667f9fe7709b
            mimhid_asset: libmimhid-*-linux-x86_64-ubuntu22.04-shared.tar.gz
            mimhid_sha256: ea53bae660bd657ef3c48ed4e5d1e7963a1533e31058a3d5b3b9cd25ae2fba92
          - os: windows-2022
            platform: windows
            name: windows-x86_64
            aoahid_asset: libaoahid-*-windows-x86_64-shared.zip
            aoahid_sha256: fd50e681064d54dd40def89f0d47990204d865cc41193c11c4a9323f140f9c50
            mimhid_asset: libmimhid-*-windows-x86_64-shared.zip
            mimhid_sha256: 7aa56f474f48dc50b6b90df4cd68caae0ef095f12f2619fd876e95457ec48380
          - os: macos-15
            platform: macos
            name: macos-arm64
            aoahid_asset: libaoahid-*-macos-arm64-shared.tar.gz
            aoahid_sha256: 350040e9e9562e1783fed73e42e4fc7886b48dca6cef5a5b4ffbaf97cfebc9ed
            mimhid_asset: libmimhid-*-macos-arm64-shared.tar.gz
            mimhid_sha256: f61d1c03f0f4a4d80143b4371794eb9f0c5ff9e207a0eea8b9c950d319a06765
          - os: macos-15-intel
            platform: macos
            name: macos-x86_64
            aoahid_asset: libaoahid-*-macos-x86_64-shared.tar.gz
            aoahid_sha256: c9a21027af6c95e3e9ab73a4cc58d268522acc90f4c742ac38af8a201b7fc9de
            mimhid_asset: libmimhid-*-macos-x86_64-shared.tar.gz
            mimhid_sha256: 2975d7fa91ed4b8ef3c54c13c88e3dfd6d2a1c202743c0bb363c204d4e073d46
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build pkg-config \
            libwayland-dev libwayland-bin libdbus-1-dev libei-dev \
            libxcb1-dev libxcb-xfixes0-dev libxcb-xinput-dev libxcb-randr0-dev \
            libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev libgl1-mesa-dev

      - name: Download libaoahid release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dependencies
          gh release download "$AOAHID_TAG" --repo "$AOAHID_REPOSITORY" \
            --pattern '${{ matrix.aoahid_asset }}' --dir dependencies
          cd dependencies
          shopt -s nullglob
          archives=(${{ matrix.aoahid_asset }})
          shopt -u nullglob
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one matching asset, found ${#archives[@]}."
            exit 1
          fi
          # Checked against the hash pinned in this file, not one fetched
          # from the same place as the archive.
          if command -v sha256sum > /dev/null; then
            echo "${{ matrix.aoahid_sha256 }}  ${archives[0]}" | sha256sum -c -
          else
            echo "${{ matrix.aoahid_sha256 }}  ${archives[0]}" | shasum -a 256 -c -
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            unzip -q "${archives[0]}"
          else
            tar -xzf "${archives[0]}"
          fi
          base="${archives[0]%.tar.gz}"
          base="${base%.zip}"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            prefix="$(cygpath -m "$PWD/$base")"
          else
            prefix="$PWD/$base"
          fi
          echo "AOAHID_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Download libmimhid release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dependencies-mimhid
          gh release download "$MIMHID_TAG" --repo "$MIMHID_REPOSITORY" \
            --pattern '${{ matrix.mimhid_asset }}' --dir dependencies-mimhid
          cd dependencies-mimhid
          shopt -s nullglob
          archives=(${{ matrix.mimhid_asset }})
          shopt -u nullglob
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one matching asset, found ${#archives[@]}."
            exit 1
          fi
          if command -v sha256sum > /dev/null; then
            echo "${{ matrix.mimhid_sha256 }}  ${archives[0]}" | sha256sum -c -
          else
            echo "${{ matrix.mimhid_sha256 }}  ${archives[0]}" | shasum -a 256 -c -
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            unzip -q "${archives[0]}"
          else
            tar -xzf "${archives[0]}"
          fi
          base="${archives[0]%.tar.gz}"
          base="${base%.zip}"
          if [ ! -f "$base/lib/cmake/mimhid/mimhid-config.cmake" ]; then
            echo "::error::$base does not look like a libmimhid CMake package."
            exit 1
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            prefix="$(cygpath -m "$PWD/$base")"
          else
            prefix="$PWD/$base"
          fi
          echo "MIMHID_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$AOAHID_PREFIX;$MIMHID_PREFIX"
          cmake --build build --config Release --parallel
          ctest --test-dir build --output-on-failure -C Release

      - name: Package
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${REF_NAME#v}"
            # The tag has to be the version the build files carry.
            grep -q "project(hid_share VERSION ${version} " CMakeLists.txt
          else
            version="$(sed -n 's/^project(hid_share VERSION \([0-9.]*\) .*/\1/p' CMakeLists.txt)"
          fi
          stage="hid-share-${version}-${{ matrix.name }}"
          cmake --install build --config Release --prefix "$stage"
          # The libaoahid and libmimhid runtimes go next to the programs, which look there.
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp "$AOAHID_PREFIX"/bin/*.dll "$MIMHID_PREFIX"/bin/*.dll "$stage/bin/"
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            cp -a "$AOAHID_PREFIX"/lib/libaoahid*.dylib "$MIMHID_PREFIX"/lib/libmimhid*.dylib "$stage/bin/"
          else
            cp -a "$AOAHID_PREFIX"/lib/libaoahid.so* "$MIMHID_PREFIX"/lib/libmimhid.so* "$stage/bin/"
          fi
          mkdir -p "$stage/licenses"
          cp README.md CHANGELOG.md LICENSE "$stage/"
          cp -R docs "$stage/docs"
          cp third_party/licenses/* "$stage/licenses/"
          cp -R "$AOAHID_PREFIX"/share/doc/libaoahid "$stage/licenses/libaoahid" 2> /dev/null || true
          cp -R "$MIMHID_PREFIX"/share/doc/libmimhid "$stage/licenses/libmimhid" 2> /dev/null || true
          if [ "${{ matrix.platform }}" = "windows" ]; then
            7z a -tzip "$stage.zip" "$stage" > /dev/null
          else
            tar -czf "$stage.tar.gz" "$stage"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            hid-share-*.tar.gz
            hid-share-*.zip
          if-no-files-found: error

  publish:
    needs: build
    # Only the push of a version tag publishes; a run started by hand never
    # does, whatever ref it was started on.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum hid-share-* > SHA256SUMS
          version="${REF_NAME#v}"
          # The notes are this version's section of the changelog.
          awk -v v="## ${version}" '$0 == v {on = 1; next} /^## / {on = 0} on' \
            ../CHANGELOG.md > notes.md
          gh release create "$REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$REF_NAME" \
            --notes-file notes.md hid-share-* SHA256SUMS
