name: release

# Builds the archives for a version tag and publishes them as a GitHub
# release. Tag only a commit whose ci run passed.
on:
  push:
    tags:
      - "v*"
  # Run by hand, it builds and uploads the archives but publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

env:
  AOAHID_REPOSITORY: nemarpuc/libaoahid
  # Changing the tag means changing the hashes in the matrix below too.
  AOAHID_TAG: v0.2.0
  MIMUSB_REPOSITORY: nemarpuc/libmimusb
  # Changing the tag means changing the hashes in the matrix below too.
  MIMUSB_TAG: v0.7.2

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built on Ubuntu 22.04 (glibc 2.35, like libaoahid and libmimusb), so the
          # programs run on it and on anything newer, not only on the runner's own release.
          - os: ubuntu-22.04
            platform: linux
            name: linux-x86_64
            aoahid_asset: libaoahid-*-linux-x86_64-ubuntu22.04.tar.gz
            aoahid_sha256: def7b55f6c54a372a2eca23166ec91d89458048300cd466358ab5d5341357289
            mimusb_asset: libmimusb-*-linux-x86_64-ubuntu22.04.tar.gz
            mimusb_sha256: 8ccad9db0422a0c7d88a2cf4a3d68af438d1918a886e08127971dc2766b0db29
          - os: windows-2022
            platform: windows
            name: windows-x86_64
            aoahid_asset: libaoahid-*-windows-x86_64.zip
            aoahid_sha256: 48fe342efa2083e3ee4560ef9471bbc8330241df3395dce58b883f69174bc610
            mimusb_asset: libmimusb-*-windows-x86_64.zip
            mimusb_sha256: 9bba4653ca977316ba1d265dd7bb7169b3693a850e4faa6affff79b482c4c734
          - os: macos-15
            platform: macos
            name: macos-arm64
            aoahid_asset: libaoahid-*-macos-arm64.tar.gz
            aoahid_sha256: 643b0be661a3d4f60eaf7cfd23bfe169df381bd0bc269f081b47d1146caccb02
            mimusb_asset: libmimusb-*-macos-arm64.tar.gz
            mimusb_sha256: bc3774c0251ae89bce554c743b3adc2a2b043a03abaea757e1873228ad40b737
          - os: macos-15-intel
            platform: macos
            name: macos-x86_64
            aoahid_asset: libaoahid-*-macos-x86_64.tar.gz
            aoahid_sha256: 37a9d61f167533b9f07a1d487abce547171c2f95421cc41de4702f846910b387
            mimusb_asset: libmimusb-*-macos-x86_64.tar.gz
            mimusb_sha256: 56cee44fa036fe876086536f87a8efd2799dc1e3aede1fe7d142610bdc6df3db
          - os: ubuntu-22.04-arm
            platform: linux
            name: linux-aarch64
            aoahid_asset: libaoahid-*-linux-aarch64-ubuntu22.04.tar.gz
            aoahid_sha256: 1d3afe1a4c436c65802aa506d8388cd3fe65a6bdef5b6f07610607550cb4612d
            mimusb_asset: libmimusb-*-linux-aarch64-ubuntu22.04.tar.gz
            mimusb_sha256: cafd574bf2085af37e75cac228034248aa13af0b25f4db200ab45a3abaf3ec5d
          - os: windows-11-arm
            platform: windows
            cmake_arch: ARM64
            name: windows-arm64
            aoahid_asset: libaoahid-*-windows-arm64.zip
            aoahid_sha256: f03a1682e5a03c3b6d6de4b9b5452e762fe120062a65760b2983388f4117abce
            mimusb_asset: libmimusb-*-windows-arm64.zip
            mimusb_sha256: 3b2c6151b3d46a994d71ee025c6903b092441ed226175096b5b682b0cbc5f9d2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build pkg-config \
            meson python3-attr python3-jinja2 curl bzip2 \
            libwayland-dev libwayland-bin libdbus-1-dev \
            libxcb1-dev libxcb-xfixes0-dev libxcb-xinput-dev libxcb-randr0-dev \
            libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev libgl1-mesa-dev

      - name: Build libei
        if: matrix.platform == 'linux'
        run: .github/scripts/build-libei.sh

      - name: Download libaoahid release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dependencies
          gh release download "$AOAHID_TAG" --repo "$AOAHID_REPOSITORY" \
            --pattern '${{ matrix.aoahid_asset }}' --dir dependencies
          cd dependencies
          shopt -s nullglob
          archives=(${{ matrix.aoahid_asset }})
          shopt -u nullglob
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one matching asset, found ${#archives[@]}."
            exit 1
          fi
          # Checked against the hash pinned in this file, not one fetched
          # from the same place as the archive.
          if command -v sha256sum > /dev/null; then
            echo "${{ matrix.aoahid_sha256 }}  ${archives[0]}" | sha256sum -c -
          else
            echo "${{ matrix.aoahid_sha256 }}  ${archives[0]}" | shasum -a 256 -c -
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            unzip -q "${archives[0]}"
          else
            tar -xzf "${archives[0]}"
          fi
          base="${archives[0]%.tar.gz}"
          base="${base%.zip}"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            prefix="$(cygpath -m "$PWD/$base")"
          else
            prefix="$PWD/$base"
          fi
          echo "AOAHID_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Download libmimusb release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dependencies-mimusb
          gh release download "$MIMUSB_TAG" --repo "$MIMUSB_REPOSITORY" \
            --pattern '${{ matrix.mimusb_asset }}' --dir dependencies-mimusb
          cd dependencies-mimusb
          shopt -s nullglob
          archives=(${{ matrix.mimusb_asset }})
          shopt -u nullglob
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one matching asset, found ${#archives[@]}."
            exit 1
          fi
          if command -v sha256sum > /dev/null; then
            echo "${{ matrix.mimusb_sha256 }}  ${archives[0]}" | sha256sum -c -
          else
            echo "${{ matrix.mimusb_sha256 }}  ${archives[0]}" | shasum -a 256 -c -
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            unzip -q "${archives[0]}"
          else
            tar -xzf "${archives[0]}"
          fi
          base="${archives[0]%.tar.gz}"
          base="${base%.zip}"
          if [ ! -f "$base/lib/cmake/mimusb/mimusb-config.cmake" ]; then
            echo "::error::$base does not look like a libmimusb CMake package."
            exit 1
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            prefix="$(cygpath -m "$PWD/$base")"
          else
            prefix="$PWD/$base"
          fi
          echo "MIMUSB_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          # The Visual Studio generator is told the architecture; the others need nothing.
          if [ -n "${{ matrix.cmake_arch }}" ]; then
            cmake -S . -B build -A "${{ matrix.cmake_arch }}" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$AOAHID_PREFIX;$MIMUSB_PREFIX"
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$AOAHID_PREFIX;$MIMUSB_PREFIX"
          fi
          cmake --build build --config Release --parallel
          ctest --test-dir build --output-on-failure -C Release

      - name: Package
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${REF_NAME#v}"
            # The tag has to be the version the build files carry.
            grep -q "project(hid_share VERSION ${version} " CMakeLists.txt
          else
            version="$(sed -n 's/^project(hid_share VERSION \([0-9.]*\) .*/\1/p' CMakeLists.txt)"
          fi
          stage="hid-share-${version}-${{ matrix.name }}"
          cmake --install build --config Release --prefix "$stage"
          # The libaoahid and libmimusb runtimes go next to the programs, which look there.
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp "$AOAHID_PREFIX"/bin/*.dll "$MIMUSB_PREFIX"/bin/*.dll "$stage/bin/"
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            cp -a "$AOAHID_PREFIX"/lib/libaoahid*.dylib "$AOAHID_PREFIX"/lib/libusb*.dylib "$MIMUSB_PREFIX"/lib/libmimusb*.dylib "$stage/bin/"
          else
            cp -a "$AOAHID_PREFIX"/lib/libaoahid.so* "$AOAHID_PREFIX"/lib/libusb-1.0.so* "$MIMUSB_PREFIX"/lib/libmimusb.so* "$stage/bin/"
            # libei is not packaged on the older systems, so it travels with the programs.
            cp -a "$LIBEI_PREFIX"/lib/libei.so* "$stage/bin/"
          fi
          mkdir -p "$stage/licenses"
          cp README.md CHANGELOG.md LICENSE "$stage/"
          cp -R docs "$stage/docs"
          cp third_party/licenses/* "$stage/licenses/"
          cp -R "$AOAHID_PREFIX"/share/doc/libaoahid "$stage/licenses/libaoahid" 2> /dev/null || true
          cp -R "$MIMUSB_PREFIX"/share/doc/libmimusb "$stage/licenses/libmimusb" 2> /dev/null || true
          if [ "${{ matrix.platform }}" = "linux" ]; then
            install -D "$LIBEI_PREFIX/share/doc/libei/COPYING" "$stage/licenses/libei/COPYING"
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            7z a -tzip "$stage.zip" "$stage" > /dev/null
          else
            tar -czf "$stage.tar.gz" "$stage"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            hid-share-*.tar.gz
            hid-share-*.zip
          if-no-files-found: error

  publish:
    needs: build
    # Only the push of a version tag publishes; a run started by hand never
    # does, whatever ref it was started on.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum hid-share-* > SHA256SUMS
          version="${REF_NAME#v}"
          # The notes are this version's section of the changelog.
          # The heading is "## X.Y.Z", optionally followed by " - date".
          awk -v v="## ${version}" \
            'index($0, v) == 1 && (length($0) == length(v) || substr($0, length(v) + 1, 1) == " ") {on = 1; next} /^## / {on = 0} on' \
            ../CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${version}."; exit 1
          fi
          gh release create "$REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$REF_NAME" \
            --notes-file notes.md hid-share-* SHA256SUMS
