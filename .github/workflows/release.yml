name: release

# Builds the archives for a version tag and publishes them as a GitHub
# release. Tag only a commit whose ci run passed.
on:
  push:
    tags:
      - "v*"
  # Run by hand, it builds and uploads the archives but publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

env:
  AOAHID_REPOSITORY: nemarpuc/libaoahid
  # Changing the tag means changing the hashes in the matrix below too.
  AOAHID_TAG: v0.2.0
  MIMHID_REPOSITORY: nemarpuc/libmimhid
  # Changing the tag means changing the hashes in the matrix below too.
  MIMHID_TAG: v0.2.1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built on Ubuntu 22.04 (glibc 2.35, like libaoahid and libmimhid), so the
          # programs run on it and on anything newer, not only on the runner's own release.
          - os: ubuntu-22.04
            platform: linux
            name: linux-x86_64
            aoahid_asset: libaoahid-*-linux-x86_64-ubuntu22.04.tar.gz
            aoahid_sha256: b51c5f2f9e8bdcc1acd854ffe745e2f70f77862a2aea9ca503da060a015dcde7
            mimhid_asset: libmimhid-*-linux-x86_64-ubuntu22.04.tar.gz
            mimhid_sha256: 39786fa2abcbe18fbe52db52c8e715f2eec4e98ccab589f221514b076c2b514c
          - os: windows-2022
            platform: windows
            name: windows-x86_64
            aoahid_asset: libaoahid-*-windows-x86_64.zip
            aoahid_sha256: 7ee281347d14e30a92540ab0ae88adb609b6af2da4af112c2975201ff284419b
            mimhid_asset: libmimhid-*-windows-x86_64.zip
            mimhid_sha256: b4fc768a409f907e94f020480801998e757327c45daa03a9c6b4adecee7a6f57
          - os: macos-15
            platform: macos
            name: macos-arm64
            aoahid_asset: libaoahid-*-macos-arm64.tar.gz
            aoahid_sha256: 9c4ce83ba3b313c00d2888a5ea6bfb1b7abf9f19c0c2120859bdda6327d6c65a
            mimhid_asset: libmimhid-*-macos-arm64.tar.gz
            mimhid_sha256: a01dc1143123e8c5ccd46f0e65b8ea716ed2d76668aacd6b61e61fcbf866277e
          - os: macos-15-intel
            platform: macos
            name: macos-x86_64
            aoahid_asset: libaoahid-*-macos-x86_64.tar.gz
            aoahid_sha256: 4dd285d28fa4fca4a0838ce8e6f53d9ea63a36ca1b8968e3c2202f4a69002d28
            mimhid_asset: libmimhid-*-macos-x86_64.tar.gz
            mimhid_sha256: 0d008b410328483f665b21646dce6d786b2087df7ba9999b19d4f0b9d4c096b2
          - os: ubuntu-22.04-arm
            platform: linux
            name: linux-aarch64
            aoahid_asset: libaoahid-*-linux-aarch64-ubuntu22.04.tar.gz
            aoahid_sha256: 57a098bc1357159fd26d32940d2011355321f35f44c3a5e26636ae3a6a281a92
            mimhid_asset: libmimhid-*-linux-aarch64-ubuntu22.04.tar.gz
            mimhid_sha256: 4a71fd67805baa38f8f1e84080652035333e969609dc235c334ec8413a8eb21b
          - os: windows-11-arm
            platform: windows
            cmake_arch: ARM64
            name: windows-arm64
            aoahid_asset: libaoahid-*-windows-arm64.zip
            aoahid_sha256: 5435e0850d04683faa5a4d926b02f6e8a3620916981f54cb573bd27cba7a03c7
            mimhid_asset: libmimhid-*-windows-arm64.zip
            mimhid_sha256: 43edc4cd880a1809acbe5f91570c77ce7da4eb080219028279ebbdb9c7b9a88b
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build pkg-config \
            meson python3-attr python3-jinja2 curl bzip2 \
            libwayland-dev libwayland-bin libdbus-1-dev \
            libxcb1-dev libxcb-xfixes0-dev libxcb-xinput-dev libxcb-randr0-dev \
            libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev libgl1-mesa-dev

      - name: Build libei
        if: matrix.platform == 'linux'
        run: .github/scripts/build-libei.sh

      - name: Download libaoahid release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dependencies
          gh release download "$AOAHID_TAG" --repo "$AOAHID_REPOSITORY" \
            --pattern '${{ matrix.aoahid_asset }}' --dir dependencies
          cd dependencies
          shopt -s nullglob
          archives=(${{ matrix.aoahid_asset }})
          shopt -u nullglob
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one matching asset, found ${#archives[@]}."
            exit 1
          fi
          # Checked against the hash pinned in this file, not one fetched
          # from the same place as the archive.
          if command -v sha256sum > /dev/null; then
            echo "${{ matrix.aoahid_sha256 }}  ${archives[0]}" | sha256sum -c -
          else
            echo "${{ matrix.aoahid_sha256 }}  ${archives[0]}" | shasum -a 256 -c -
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            unzip -q "${archives[0]}"
          else
            tar -xzf "${archives[0]}"
          fi
          base="${archives[0]%.tar.gz}"
          base="${base%.zip}"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            prefix="$(cygpath -m "$PWD/$base")"
          else
            prefix="$PWD/$base"
          fi
          echo "AOAHID_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Download libmimhid release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dependencies-mimhid
          gh release download "$MIMHID_TAG" --repo "$MIMHID_REPOSITORY" \
            --pattern '${{ matrix.mimhid_asset }}' --dir dependencies-mimhid
          cd dependencies-mimhid
          shopt -s nullglob
          archives=(${{ matrix.mimhid_asset }})
          shopt -u nullglob
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one matching asset, found ${#archives[@]}."
            exit 1
          fi
          if command -v sha256sum > /dev/null; then
            echo "${{ matrix.mimhid_sha256 }}  ${archives[0]}" | sha256sum -c -
          else
            echo "${{ matrix.mimhid_sha256 }}  ${archives[0]}" | shasum -a 256 -c -
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            unzip -q "${archives[0]}"
          else
            tar -xzf "${archives[0]}"
          fi
          base="${archives[0]%.tar.gz}"
          base="${base%.zip}"
          if [ ! -f "$base/lib/cmake/mimhid/mimhid-config.cmake" ]; then
            echo "::error::$base does not look like a libmimhid CMake package."
            exit 1
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            prefix="$(cygpath -m "$PWD/$base")"
          else
            prefix="$PWD/$base"
          fi
          echo "MIMHID_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          # The Visual Studio generator is told the architecture; the others need nothing.
          if [ -n "${{ matrix.cmake_arch }}" ]; then
            cmake -S . -B build -A "${{ matrix.cmake_arch }}" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$AOAHID_PREFIX;$MIMHID_PREFIX"
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$AOAHID_PREFIX;$MIMHID_PREFIX"
          fi
          cmake --build build --config Release --parallel
          ctest --test-dir build --output-on-failure -C Release

      - name: Package
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${REF_NAME#v}"
            # The tag has to be the version the build files carry.
            grep -q "project(hid_share VERSION ${version} " CMakeLists.txt
          else
            version="$(sed -n 's/^project(hid_share VERSION \([0-9.]*\) .*/\1/p' CMakeLists.txt)"
          fi
          stage="hid-share-${version}-${{ matrix.name }}"
          cmake --install build --config Release --prefix "$stage"
          # The libaoahid and libmimhid runtimes go next to the programs, which look there.
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp "$AOAHID_PREFIX"/bin/*.dll "$MIMHID_PREFIX"/bin/*.dll "$stage/bin/"
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            cp -a "$AOAHID_PREFIX"/lib/libaoahid*.dylib "$MIMHID_PREFIX"/lib/libmimhid*.dylib "$stage/bin/"
          else
            cp -a "$AOAHID_PREFIX"/lib/libaoahid.so* "$MIMHID_PREFIX"/lib/libmimhid.so* "$stage/bin/"
            # libei is not packaged on the older systems, so it travels with the programs.
            cp -a "$LIBEI_PREFIX"/lib/libei.so* "$stage/bin/"
          fi
          mkdir -p "$stage/licenses"
          cp README.md CHANGELOG.md LICENSE "$stage/"
          cp -R docs "$stage/docs"
          cp third_party/licenses/* "$stage/licenses/"
          cp -R "$AOAHID_PREFIX"/share/doc/libaoahid "$stage/licenses/libaoahid" 2> /dev/null || true
          cp -R "$MIMHID_PREFIX"/share/doc/libmimhid "$stage/licenses/libmimhid" 2> /dev/null || true
          if [ "${{ matrix.platform }}" = "linux" ]; then
            install -D "$LIBEI_PREFIX/share/doc/libei/COPYING" "$stage/licenses/libei/COPYING"
          fi
          if [ "${{ matrix.platform }}" = "windows" ]; then
            7z a -tzip "$stage.zip" "$stage" > /dev/null
          else
            tar -czf "$stage.tar.gz" "$stage"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            hid-share-*.tar.gz
            hid-share-*.zip
          if-no-files-found: error

  publish:
    needs: build
    # Only the push of a version tag publishes; a run started by hand never
    # does, whatever ref it was started on.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum hid-share-* > SHA256SUMS
          version="${REF_NAME#v}"
          # The notes are this version's section of the changelog.
          # The heading is "## X.Y.Z", optionally followed by " - date".
          awk -v v="## ${version}" \
            'index($0, v) == 1 && (length($0) == length(v) || substr($0, length(v) + 1, 1) == " ") {on = 1; next} /^## / {on = 0} on' \
            ../CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${version}."; exit 1
          fi
          gh release create "$REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$REF_NAME" \
            --notes-file notes.md hid-share-* SHA256SUMS
